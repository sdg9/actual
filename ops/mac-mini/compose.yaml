name: actual
services:
  actual:
    image: actual-household-ui:dce00af72
    ports:
      - '127.0.0.1:5006:5006'
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
