name: actual
services:
  actual:
    image: actualbudget/actual-server@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    ports:
      - '127.0.0.1:5006:5006'
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
